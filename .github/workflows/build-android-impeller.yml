name: Android Impeller Build

# 独立构建 fork 分支，不修改原有 Skia 发布/CI 工作流。
on:
  push:
    branches: [rust-local-force-fork]
    paths:
      - '.github/workflows/build-android-impeller.yml'
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'shaders/**'
      - 'third_party/**'
      - 'kugou_api_server/rust/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK 构建类型'
        type: choice
        required: true
        default: release
        options: [release, debug]

permissions:
  contents: read

concurrency:
  group: android-impeller-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}

defaults:
  run:
    shell: bash

jobs:
  build-android:
    name: Android arm64 / Impeller
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-impeller-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-impeller-${{ runner.os }}-

      # 从本分支源码重建，避免 APK 使用与下载/标签代码不匹配的旧 .so。
      - name: Build Rust library for Android arm64
        working-directory: kugou_api_server/rust
        run: |
          set -euo pipefail
          ndk_bin="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android21-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk_bin/aarch64-linux-android21-clang"
          cargo build --locked --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/libkugou_server.so \
            ../../android/app/src/main/jniLibs/arm64-v8a/libkugou_server.so

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 不使用 --no-pub，确保生成 release/debug 对应的插件注册文件。
      # 签名沿用项目配置；未配置 release keystore 时使用现有测试签名回退。
      - name: Build APK with Impeller enabled
        run: |
          set -euo pipefail
          case "$BUILD_TYPE" in release|debug) ;; *) exit 1 ;; esac
          flutter build apk "--$BUILD_TYPE" --flavor lite --split-per-abi \
            --target-platform android-arm64 \
            --android-project-arg=md3EnableImpeller=true

      - name: Verify and name Impeller APK
        id: package
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          apk="$apk_dir/app-arm64-v8a-lite-${BUILD_TYPE}.apk"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -s "$apk"
          unzip -tq "$apk"
          "$aapt2" dump badging "$apk" > "$RUNNER_TEMP/impeller-badging.txt"
          grep -q "^package: name='com.md3music.md3music' " "$RUNNER_TEMP/impeller-badging.txt"
          grep -q "^native-code: 'arm64-v8a'$" "$RUNNER_TEMP/impeller-badging.txt"
          "$aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$RUNNER_TEMP/impeller-manifest.txt"
          # 按 meta-data 元素解析，兼容 name/value 顺序及 true/十六进制输出。
          python3 - "$RUNNER_TEMP/impeller-manifest.txt" <<'PY'
          import pathlib, re, sys
          nodes = []
          current = None
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              text = line.strip()
              if text.startswith("E:"):
                  current = {} if re.match(r"E:\s+meta-data(?:\s|$)", text) else None
                  if current is not None:
                      nodes.append(current)
              elif current is not None:
                  attr = re.search(r"android:(name|value)(?:\([^)]*\))?\s*=\s*(.*)$", text)
                  if attr:
                      current[attr[1]] = attr[2].strip()
          values = []
          for node in nodes:
              name = re.match(r'"([^"]+)"', node.get("name", ""))
              if name and name[1] == "io.flutter.embedding.android.EnableImpeller":
                  values.append(node.get("value", ""))
          if len(values) != 1 or not re.fullmatch(
              r'(?:\(type [^)]+\)\s*)?(?:true|0xffffffff|0x1|"true"(?:\s+\(Raw: "true"\))?)',
              values[0], re.IGNORECASE,
          ):
              raise SystemExit(f"APK 未明确启用 Impeller: {values}")
          print("Verified EnableImpeller=true")
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          unzip -p "$apk" lib/arm64-v8a/libkugou_server.so > "$RUNNER_TEMP/impeller-libkugou_server.so"
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --dyn-syms --wide "$RUNNER_TEMP/impeller-libkugou_server.so" > "$RUNNER_TEMP/impeller-symbols.txt"
          for symbol in md3_tag_writer_inspect md3_tag_writer_write md3_tag_writer_free_json; do
            grep -Eq "[[:space:]]${symbol}$" "$RUNNER_TEMP/impeller-symbols.txt"
          done
          version="$(awk '/^version:/ { split($2, v, "+"); print v[1]; exit }' pubspec.yaml)"
          name="MD3Music-${version}-standard-arm64-v8a-impeller-${BUILD_TYPE}.apk"
          mv "$apk" "$apk_dir/$name"
          (cd "$apk_dir" && sha256sum "$name" > "$name.sha256")
          echo "apk=$apk_dir/$name" >> "$GITHUB_OUTPUT"
          printf '### Android Impeller APK\n\n- File: `%s`\n- Engine setting: `EnableImpeller=true`\n- ABI: `arm64-v8a`\n' "$name" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and SHA-256
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MD3Music-standard-arm64-impeller-${{ env.BUILD_TYPE }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 14
